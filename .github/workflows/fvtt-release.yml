
name: FVTT Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version (example: 1.4.2)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: fvtt-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          version = os.environ["VERSION"]

          assert re.fullmatch(r"\d+\.\d+\.\d+", version), "Invalid version"
          assert tuple(map(int, version.split("."))) > (1, 4, 1), "Existing versions are protected"

          with open("module.json", encoding="utf-8") as f:
              module = json.load(f)

          assert module["id"] == "my-module"
          assert module["version"] == version, "Version mismatch"

          expected = (
              "https://github.com/Trainrobbery/my-fvtt-module/"
              f"releases/download/v{version}/my-module.zip"
          )
          assert module["download"] == expected, "Download URL mismatch"

          assert module["manifest"] == (
              "https://raw.githubusercontent.com/"
              "Trainrobbery/my-fvtt-module/main/module.json"
          ), "Manifest URL mismatch"

          print("Version verified:", version)
          PY

      - name: Protect existing releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG"
            exit 1
          fi

      - name: Create module ZIP
        run: |
          git archive --format=zip --output=my-module.zip HEAD -- . ':(exclude).github'

      - name: Verify ZIP
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import zipfile

          with zipfile.ZipFile("my-module.zip") as z:
              files = set(z.namelist())

              assert "module.json" in files
              assert "my-module.js" in files
              assert "my-module.css" in files
              assert z.testzip() is None

              module = json.loads(z.read("module.json"))
              assert module["version"] == os.environ["VERSION"]

          print("ZIP verification passed")
          PY

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${VERSION}" ./my-module.zip \
            --target "$(git rev-parse HEAD)" \
            --title "v${VERSION}" \
            --generate-notes
